[project]
name = "forge"
version = "0.1.0"
description = "Forge, a tiny-LM data lab"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "trafilatura>=1.12",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",  # fastapi needs it for uploads
]

[project.optional-dependencies]
# keep torch optional, its huge
train = [
    "torch>=2.3",
    "numpy>=1.26",
]
converter = [
    "docling>=2.126.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # fastapi's TestClient needs it
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# fastapi uses calls in defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.pyright]
include = ["forge", "tests", "../scripts"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# torch might not be installed
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: takes more than a few seconds (still runs in CI)",
]
